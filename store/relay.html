<!doctype html><meta charset="utf-8"><script>addEventListener("message",async e=>{if(e.origin!=="https://appstoreconnect.apple.com")return;const n=e.data&&e.data.n;if(!/^[\w.-]+\.png$/.test(n||""))return;const b=await (await fetch(n,{cache:"no-store"})).blob();e.source.postMessage({n,b},e.origin);});parent.postMessage({ready:1},"https://appstoreconnect.apple.com");</script>
